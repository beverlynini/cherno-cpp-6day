<!doctype html>
<html lang="zh-CN">

<title>TheCherno C++ 六天冲刺</title>
<style>
:root {
  --bg: #f3f6f7;
  --surface: #ffffff;
  --text: #17212b;
  --muted: #667085;
  --border: #d7e0e5;
  --accent: #0f766e;
  --accent-soft: #dff5f0;
  --amber: #9a5b00;
  --amber-soft: #fdf0d8;
  --blue: #1d4ed8;
  --danger: #b42318;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  line-height: 1.55;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  color: var(--blue);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

.icon {
  width: 15px;
  height: 15px;
  flex: 0 0 auto;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.app-header {
  background: #13202f;
  color: #f8fafc;
  padding: 20px 24px 0;
}

.header-main {
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  gap: 24px;
  align-items: flex-start;
}

.title-block {
  display: flex;
  gap: 14px;
  align-items: center;
}

.course-mark {
  width: 52px;
  height: 52px;
  border-radius: var(--radius);
  background: var(--accent);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 18px;
}

.eyebrow {
  margin: 0 0 4px;
  color: #9fb3c8;
  font-size: 12px;
  letter-spacing: .08em;
}

.eyebrow a {

}

.app-header h1 {
  margin: 0;
  font-size: 24px;
  line-height: 1.2;
}

.subtitle {

  color: #cbd5e1;
  font-size: 13px;
}

.overall {
  min-width: 280px;
  max-width: 380px;
  flex: 1;
}

.overall-line {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: #e2e8f0;
  font-size: 13px;
  margin-bottom: 7px;
}

.overall-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 7px;
  color: #b9c6d4;
  font-size: 12px;
}

.view-tabs {
  max-width: 1240px;
  margin: 18px auto 0;

  gap: 4px;
  overflow-x: auto;
  padding-bottom: 0;
}

.view-tabs button {

  background: transparent;
  color: #b9c6d4;
  padding: 10px 14px;
  border-bottom: 3px solid transparent;

}

.view-tabs button:hover {

}

.view-tabs button.active {

}

.view {

  margin: 0 auto;
  padding: 24px;
}

.overview-head,
.catalog-head {

  justify-content: space-between;
  gap: 16px;
  align-items: flex-end;
  margin-bottom: 16px;
}

.overview-head h2,
.catalog-head h2 {
  margin: 0 0 4px;
  font-size: 20px;
}

.overview-head p,
.catalog-head p {
  margin: 0;

  font-size: 14px;
}

.day-grid {

  gap: 16px;
}

.day-card {

  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.day-card.today {
  border-color: #2dd4bf;
  box-shadow: 0 0 0 3px rgba(45, 212, 191, .15);
}

.day-card-top {

  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: 12px;
}

.day-index {
  font-weight: 700;
  color: var(--accent);
  letter-spacing: .08em;
}

.today-text {
  color: var(--accent);
}

.day-card h3 {
  margin: 0;
  font-size: 18px;
}

.day-card > p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  min-height: 42px;
}

.day-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  font-size: 12px;
  color: var(--muted);
}

.day-stats span {
  background: #eef2f5;
  border-radius: 999px;
  padding: 4px 8px;
}

.day-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: auto;
  color: var(--muted);
  font-size: 13px;
}

.progress-track {
  height: 8px;
  overflow: hidden;
  background: #dbe3e8;
  border-radius: 999px;
}

.progress-track.small {
  height: 6px;
}

.progress-fill {
  width: 0;
  height: 100%;
  background: var(--accent);
  transition: width .18s ease;
}

.text-button,
.ghost-button,
.primary-button {
  border-radius: var(--radius);
  padding: 8px 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.text-button {
  border: 0;
  background: transparent;
  color: var(--blue);
  padding: 4px 0;
  font-weight: 600;
}

.ghost-button {
  border: 1px solid #405265;
  background: transparent;
  color: #dbe6f0;
}

.ghost-button:hover {
  border-color: #7dd3c7;
  color: #ffffff;
}

.primary-button {
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #ffffff;
  font-weight: 600;
}

.primary-button:hover {
  background: #0b5f59;
}

.day-view-head {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: var(--shadow);
}

.day-view-title h2 {
  margin: 0 0 6px;
  font-size: 24px;
}

.day-view-title p {
  margin: 0;
  color: var(--muted);
}

.day-head-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 18px;
}

.stat {
  min-width: 122px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  background: #fbfcfd;
}

.stat span,
.stat small {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.stat strong {
  display: block;
  margin: 2px 0;
  font-size: 15px;
}

.day-progress-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  color: var(--muted);
  font-size: 13px;
}

.day-progress-row .progress-track {

.block,
.optional-block,
.skip-details {

  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-top: 16px;
  padding: 20px;
  box-shadow: var(--shadow);
}

.block-head {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: baseline;
  margin-bottom: 14px;
}

.block-head h3 {
  margin: 0;
  font-size: 17px;
}

.block-head span {

  font-size: 13px;
}

.lesson-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.lesson {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: start;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fbfcfd;
}

.lesson.optional {

  border-color: #f0dfc0;
}

.lesson.done,

}

.lesson.done h4,
.exercise.done h4 {
  text-decoration: line-through;
}

.lesson-title-row {
  display: flex;
  gap: 8px;
  align-items: baseline;
  flex-wrap: wrap;
}

.lesson h4 {
  margin: 0;
  font-size: 15px;
}

.p-tag {
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
  color: var(--muted);
  background: #eef2f5;
  padding: 2px 6px;
  border-radius: 4px;
}

.tier {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
}

.tier.required {
  color: var(--accent);
  background: var(--accent-soft);
}

.tier.optional {
  color: var(--amber);
  background: var(--amber-soft);
}

.lesson .cn {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.lesson-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 7px;
  color: var(--muted);
  font-size: 12px;
}

.duration,
.video-link,
.code-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.video-link,
.code-link {
  font-weight: 600;
  color: var(--blue);
}

.checkbox {
  position: relative;
  display: block;
  width: 22px;
  height: 22px;
  margin-top: 1px;
}

.checkbox input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.checkbox-box {
  display: block;
  width: 22px;
  height: 22px;
  border: 1.5px solid #b8c3cc;
  border-radius: 6px;
  background: #ffffff;
  transition: background .12s ease, border-color .12s ease;
}

.checkbox input:checked + .checkbox-box {
  background: var(--accent);
  border-color: var(--accent);
}

.checkbox input:checked + .checkbox-box::after {
  content: "";
  position: absolute;
  left: 7px;
  top: 3px;
  width: 6px;
  height: 11px;
  border: solid #ffffff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.exercise-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.exercise {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fbfcfd;
}

.exercise-title {
  display: flex;
  gap: 8px;
  align-items: baseline;
  flex-wrap: wrap;
}

.exercise-title h4 {
  margin: 0;
  font-size: 15px;
}

.exercise-num {

  font-size: 12px;
  font-weight: 700;
  font-family: Consolas, "Courier New", monospace;
}

.exercise p {

}

.exercise .accept {

}

.exercise .accept strong {
  margin-right: 6px;
  color: var(--text);
}

.exercise .code-link {
  margin-top: 8px;
  font-size: 13px;
}

.exercise .goal {
  color: var(--text);
  font-size: 14px;
}

.requirements {
  margin: 6px 0 0;
  padding-left: 20px;
  color: #475467;
  font-size: 13px;
}

.requirements li + li {
  margin-top: 4px;
}

.hint {
  margin: 6px 0 0;
  padding: 6px 8px;
  border-left: 3px solid var(--amber);
  background: #fffaf0;
  color: #7a4a00;
  font-size: 13px;
}

.example {
  margin: 6px 0 0;
  padding: 6px 8px;
  border-left: 3px solid var(--blue);
  background: #f2f6ff;
  color: #1d4ed8;

}

.reference-link {

.exercise-actions,
.day-actions,
.overview-actions {

  gap: 8px;

}

.exercise-actions {
  margin-top: 10px;
}

.day-actions,
.overview-actions {
  margin-top: 14px;
}

.secondary-button {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius);
  padding: 8px 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.secondary-button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.copy-button {
  border: 1px solid var(--border);
  background: #ffffff;
  color: var(--text);
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 13px;

}

.copy-button:hover {

}

.header-link {

}

.luogu-note {

.luogu-grid {

.luogu-card {

.luogu-card:hover {

.luogu-card strong {

.luogu-go {

.optional-block {

.optional-block .exercise-list {

.optional-block summary,
.skip-details summary {

.optional-block[open] summary {

}

.optional-block .lesson-list {

}

.skip-list {

}

.skip-list li + li {
  margin-top: 6px;
}

.skip-list a {
  color: var(--blue);
}

.day-note {
  margin-top: 16px;
  padding: 14px 16px;
  border-left: 4px solid var(--amber);

}

.day-pager {

.catalog-controls {

.search {

.table-wrap {

table {

.badge-row {

@media (max-width: 820px) {

function durationToMinutes(duration) {
  const parts = duration.split(":").map(Number);
  if (parts.length === 3) {
    return parts[0] * 60 + parts[1] + Math.round(parts[2] / 60);
  }
  return parts[0] + Math.round((parts[1] || 0) / 60);
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {
    // Fall through to the textarea fallback for file:// pages.
  }
  const textarea = document.createElement("textarea");
  textarea.value = text;
  textarea.setAttribute("readonly", "");
  textarea.style.position = "fixed";
  textarea.style.opacity = "0";
  document.body.appendChild(textarea);
  textarea.select();
  let copied = false;
  try {
    copied = document.execCommand("copy");
  } catch {
    copied = false;
  }
  document.body.removeChild(textarea);
  return copied;
}

function sumMinutes(ps) {
  return ps.reduce((total, p) => total + episode(p).minutes, 0);
}

function formatMinutes(total) {
  const hours = Math.floor(total / 60);
  const minutes = total % 60;
  if (hours === 0) {
    return `${minutes} 分`;
  }
  return minutes === 0 ? `${hours} 小时` : `${hours} 小时 ${minutes} 分`;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (character) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character]));
}

function dateOnly(year, month, day) {
  return Date.UTC(year, month - 1, day);
}

function getTodayDayId() {
  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
  const day = DAYS.find((item) => item.date === today);
  return day ? day.id : null;
}

function updateCountdown() {
  const now = new Date();
  const today = dateOnly(now.getFullYear(), now.getMonth() + 1, now.getDate());
  const start = dateOnly(2026, 10, 2);
  const end = dateOnly(2026, 10, 7);
  let text = "";
  if (today < start) {
    text = "计划未开始";
  } else if (today > end) {
    text = "计划已结束";
  } else if (today === end) {
    text = "今天是最后一天";
  } else {
    text = `剩余 ${Math.round((end - today) / 86400000)} 天`;
  }
  document.getElementById("countdownText").textContent = text;
}

function assignedDays(p) {
  const result = [];
  DAYS.forEach((day) => {
    if (day.required.includes(p)) {
      result.push({ id: day.id, tier: "required" });
    }
    if (day.optional.includes(p)) {
      result.push({ id: day.id, tier: "optional" });
    }
  });
  return result;
}

function requiredEpisodeSet() {
  return new Set(DAYS.flatMap((day) => day.required));
}

function optionalOnlyEpisodeSet() {
  const required = requiredEpisodeSet();
  return new Set(DAYS.flatMap((day) => day.optional).filter((p) => !required.has(p)));
}

function allExerciseKeys() {
  return DAYS.flatMap((day) => day.exercises.map((exercise) => `exercise:${day.id}:${exercise.id}`));
}

function updateAllProgress() {
  const requiredSet = requiredEpisodeSet();
  const optionalSet = optionalOnlyEpisodeSet();
  const exerciseKeys = allExerciseKeys();
  const watchedRequired = [...requiredSet].filter((p) => seen.has(`video:${p}`)).length;
  const watchedOptional = [...optionalSet].filter((p) => seen.has(`video:${p}`)).length;
  const doneExercises = exerciseKeys.filter((key) => seen.has(key)).length;
  const totalItems = requiredSet.size + exerciseKeys.length;
  const doneItems = watchedRequired + doneExercises;
  const overallPercent = totalItems === 0 ? 0 : Math.round((doneItems / totalItems) * 100);

  document.getElementById("overallText").textContent = `必看 ${watchedRequired}/${requiredSet.size} · 练习 ${doneExercises}/${exerciseKeys.length}`;
  document.getElementById("optionalText").textContent = `选看 ${watchedOptional}/${optionalSet.size}`;
  document.getElementById("overallBar").style.width = `${overallPercent}%`;

  DAYS.forEach((day) => {
    const dayVideoDone = day.required.filter((p) => seen.has(`video:${p}`)).length;
    const dayExerciseDone = day.exercises.filter((exercise) => seen.has(`exercise:${day.id}:${exercise.id}`)).length;
    const dayTotal = day.required.length + day.exercises.length;
    const dayDone = dayVideoDone + dayExerciseDone;
    const percent = dayTotal === 0 ? 0 : Math.round((dayDone / dayTotal) * 100);
    document.querySelectorAll(`[data-day-bar="${day.id}"]`).forEach((element) => {
      element.style.width = `${percent}%`;
    });
    document.querySelectorAll(`[data-day-count="${day.id}"]`).forEach((element) => {
      element.textContent = `${dayDone}/${dayTotal}`;
    });
  });
}

function renderTabs() {
  tabsEl.innerHTML = [
    `<button type="button" data-view="overview">总览</button>`,
    ...DAYS.map((day) => `<button type="button" data-view="${day.id}">${day.label} ${day.weekday}</button>`),
    `<button type="button" data-view="catalog">课程库</button>`
  ].join("");
}

function setActiveTab(view) {
  const key = String(view);
  tabsEl.querySelectorAll("button").forEach((button) => {
    button.classList.toggle("active", button.dataset.view === key);
  });
}

function dayCard(day) {
  const today = getTodayDayId() === day.id;
  const requiredMinutes = sumMinutes(day.required);
  const optionalMinutes = sumMinutes(day.optional);
  const totalItems = day.required.length + day.exercises.length;
  return `
    <article class="day-card${today ? " today" : ""}">
      <div class="day-card-top">
        <span class="day-index">DAY ${day.id}</span>
        <span>${day.label} ${day.weekday}${today ? ` · <strong class="today-text">今天</strong>` : ""}</span>
      </div>
      <h3>${escapeHtml(day.theme)}</h3>
      <p>${escapeHtml(day.focus)}</p>
      <div class="day-stats">
        <span>必看 ${day.required.length} 节 · ${formatMinutes(requiredMinutes)}</span>
        <span>选看 ${day.optional.length} 节 · ${formatMinutes(optionalMinutes)}</span>
        <span>练习 ${day.exercises.length} 道</span>
        <span>洛谷 ${LUOGU_PLANS[day.id]?.problems.length ?? 0} 题</span>
      </div>
      <div class="progress-track small"><div class="progress-fill" data-day-bar="${day.id}"></div></div>
      <div class="day-card-footer">
        <span data-day-count="${day.id}">0/${totalItems}</span>
        <button class="text-button" type="button" data-open-day="${day.id}">查看详情</button>
      </div>
    </article>
  `;
}

function lessonCard(episodeData, tier) {
  const isDone = seen.has(`video:${episodeData.p}`);
  const checked = isDone ? " checked" : "";
  const label = tier === "required" ? "必看" : "选看";
  return `
    <article class="lesson ${tier}${isDone ? " done" : ""}">
      <label class="checkbox" aria-label="标记 P${episodeData.p} 已看">
        <input type="checkbox" data-progress-key="video:${episodeData.p}"${checked}>
        <span class="checkbox-box"></span>
      </label>
      <div class="lesson-info">
        <div class="lesson-title-row">
          <span class="p-tag">P${episodeData.p}</span>
          <span class="tier ${tier}">${label}</span>
          <h4>${escapeHtml(episodeData.title)}</h4>
        </div>
        <p class="cn">${escapeHtml(episodeData.cn)}</p>
      </div>
      <div class="lesson-meta">
        <span class="duration"><svg class="icon" aria-hidden="true"><use href="#icon-clock"/></svg>${episodeData.duration}</span>
        <a class="video-link" href="${episodeLink(episodeData.p)}" target="_blank" rel="noreferrer">
          <svg class="icon" aria-hidden="true"><use href="#icon-play"/></svg>
          播放
        </a>
      </div>
    </article>
  `;
}

function exerciseCard(day, exercise, index) {
  const key = `exercise:${day.id}:${exercise.id}`;
  const isDone = seen.has(key);
  const checked = isDone ? " checked" : "";
  const spec = TASK_SPECS[exercise.id] || {};
  const goal = spec.goal || exercise.detail;
  const requirements = spec.requirements || [];
  const hint = spec.hint || "";
  const checks = spec.checks || [exercise.accept];
  const line = spec.line || 1;
  const taskUrl = vscodeFileUrl(`src/day${day.id}.cpp`, line);
  const referenceUrl = vscodeFileUrl(`reference/day${day.id}.cpp`, 1);
  const command = gradeDayCommand(day.id);
  return `
    <article class="exercise${isDone ? " done" : ""}">
      <label class="checkbox" aria-label="标记练习完成">
        <input type="checkbox" data-progress-key="${key}"${checked}>
        <span class="checkbox-box"></span>
      </label>
      <div>
        <div class="exercise-title">
          <span class="exercise-num">${day.id}.${index + 1}</span>
          <h4>${escapeHtml(exercise.title)}</h4>
        </div>
        <p class="goal">${escapeHtml(goal)}</p>
        ${requirements.length ? `
          <ul class="requirements">
            ${requirements.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
          </ul>
        ` : ""}
        ${hint ? `<p class="hint"><strong>提示</strong>${escapeHtml(hint)}</p>` : ""}
        <p class="accept"><strong>批改点</strong>${checks.map((item) => escapeHtml(item)).join("；")}</p>
        <div class="exercise-actions">
          <a class="code-link" href="${taskUrl}">
            <svg class="icon" aria-hidden="true"><use href="#icon-code"/></svg>
            打开做题文件
          </a>
          <a class="code-link reference-link" href="${referenceUrl}" onclick="return window.confirm('这会打开完整参考答案，确定要看吗？');">
            <svg class="icon" aria-hidden="true"><use href="#icon-code"/></svg>
            查看参考答案
          </a>
          <button class="copy-button" type="button" data-copy-command="${escapeHtml(command)}">复制批改命令</button>
        </div>
      </div>
    </article>
  `;
}

function renderOverview() {
  const todayId = getTodayDayId();
  const requiredSet = requiredEpisodeSet();
  const optionalSet = optionalOnlyEpisodeSet();
  const exerciseCount = allExerciseKeys().length;
  viewEl.innerHTML = `
    <div class="overview-head">
      <div>
        <h2>六天路线</h2>
        <p>必看 ${requiredSet.size} 节 · ${formatMinutes(sumMinutes([...requiredSet]))} · 练习 ${exerciseCount} 道 · 选看 ${optionalSet.size} 节</p>
      </div>
      <div class="overview-actions">
        ${todayId ? `<button class="primary-button" type="button" data-open-day="${todayId}">打开今天</button>` : ""}
        <a class="secondary-button" href="${vscodeFolderUrl()}">打开题目文件夹</a>
        <a class="secondary-button" href="vscode://file/${PROBLEMS_ROOT_FORWARD}/">题目说明文件夹</a>
        <button class="secondary-button" type="button" data-copy-command="${escapeHtml(gradeAllCommand())}">复制批改全部命令</button>
      </div>
    </div>
    <div class="day-grid">
      ${DAYS.map(dayCard).join("")}
    </div>
  `;
  setActiveTab("overview");
  updateAllProgress();
}

function renderDay(dayId) {
  const day = DAYS.find((item) => item.id === Number(dayId));
  if (!day) {
    renderOverview();
    return;
  }
  const requiredMinutes = sumMinutes(day.required);
  const optionalMinutes = sumMinutes(day.optional);
  const luogu = LUOGU_PLANS[day.id];
  const previous = DAYS.find((item) => item.id === day.id - 1);
  const next = DAYS.find((item) => item.id === day.id + 1);
  viewEl.innerHTML = `
    <section class="day-view-head">
      <div class="day-view-title">
        <p class="eyebrow">DAY ${day.id} · ${day.label} ${day.weekday}</p>
        <h2>${escapeHtml(day.theme)}</h2>
        <p>${escapeHtml(day.focus)}</p>
      </div>
      <div class="day-head-stats">
        <div class="stat"><span>必看</span><strong>${day.required.length} 节</strong><small>${formatMinutes(requiredMinutes)}</small></div>
        <div class="stat"><span>选看</span><strong>${day.optional.length} 节</strong><small>${formatMinutes(optionalMinutes)}</small></div>
        <div class="stat"><span>练习</span><strong>${day.exercises.length} 道</strong><small>验收标准已列出</small></div>
        <div class="stat"><span>洛谷</span><strong>${luogu ? luogu.problems.length : 0} 题</strong><small>官方入门题单</small></div>
      </div>
      <div class="day-progress-row">
        <div class="progress-track"><div class="progress-fill" data-day-bar="${day.id}"></div></div>
        <span data-day-count="${day.id}">0/${day.required.length + day.exercises.length}</span>
      </div>
      <div class="day-actions">
        <a class="secondary-button" href="${vscodeFileUrl(`src/day${day.id}.cpp`, 1)}">在 VS Code 打开本日题目</a>
        <a class="secondary-button" href="${vscodeFolderUrl()}">打开题目文件夹</a>
        <a class="secondary-button" href="${problemFileUrl(day.id)}">打开题目说明</a>
        ${luogu ? `<a class="secondary-button" href="${luogu.trainingUrl}" target="_blank" rel="noreferrer">打开洛谷题单</a>` : ""}
        <button class="secondary-button" type="button" data-copy-command="${escapeHtml(gradeDayCommand(day.id))}">复制本日批改命令</button>
      </div>
      <div class="day-note">批改脚本区分 NOT IMPLEMENTED YET（还没写完）和 FAILED（写了但检查没过）。</div>
    </section>

    <section class="block">
      <div class="block-head">
        <h3>今天看什么</h3>
        <span>必看 ${day.required.length} 节 · ${formatMinutes(requiredMinutes)}</span>
      </div>
      <div class="lesson-list">
        ${day.required.map((p) => lessonCard(episode(p), "required")).join("")}
      </div>
    </section>

    ${day.optional.length ? `
      <details class="optional-block">
        <summary>选看 ${day.optional.length} 节 · ${formatMinutes(optionalMinutes)}</summary>
        <div class="lesson-list">
          ${day.optional.map((p) => lessonCard(episode(p), "optional")).join("")}
        </div>
      </details>
    ` : ""}

    ${luogu ? `
      <section class="block">
        <div class="block-head">
          <h3>今天刷洛谷</h3>
          <span>${escapeHtml(luogu.trainingTitle)} · ${luogu.problems.length} 题</span>
        </div>
        <p class="luogu-note">${escapeHtml(luogu.note)}</p>
        <div class="luogu-grid">
          ${luogu.problems.map((problem) => `
            <a class="luogu-card" href="https://www.luogu.com.cn/problem/${escapeHtml(problem.pid)}" target="_blank" rel="noreferrer">
              <span class="p-tag">${escapeHtml(problem.pid)}</span>
              <strong>${escapeHtml(problem.title)}</strong>
              <span class="luogu-go">去洛谷</span>
            </a>
          `).join("")}
        </div>
        <div class="day-actions">
          <a class="secondary-button" href="${luogu.trainingUrl}" target="_blank" rel="noreferrer">打开完整题单</a>
        </div>
      </section>
    ` : ""}

    <details class="optional-block">
      <summary>本地练习 ${day.exercises.length} 道（可选，点开查看）</summary>
      <div class="exercise-list">
        ${day.exercises.map((exercise, index) => exerciseCard(day, exercise, index)).join("")}
      </div>
    </details>

    ${day.note ? `<div class="day-note">${escapeHtml(day.note)}</div>` : ""}

    ${day.skip && day.skip.length ? `
      <details class="skip-details">
        <summary>可跳过 ${day.skip.length} 节</summary>
        <ul class="skip-list">
          ${day.skip.map((p) => {
            const item = episode(p);
            return `<li><a href="${episodeLink(p)}" target="_blank" rel="noreferrer">P${p} ${escapeHtml(item.title)}</a> · ${escapeHtml(item.cn)}</li>`;
          }).join("")}
        </ul>
      </details>
    ` : ""}

    <div class="day-pager">
      <div>${previous ? `<button class="ghost-button" type="button" data-open-day="${previous.id}">上一天 · ${previous.label}</button>` : ""}</div>
      <div>${next ? `<button class="primary-button" type="button" data-open-day="${next.id}">下一天 · ${next.label}</button>` : ""}</div>
    </div>
  `;
  setActiveTab(day.id);
  updateAllProgress();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function catalogBadges(p) {
  const assignments = assignedDays(p);
  if (assignments.length === 0) {
    return `<span class="day-badge">未安排</span>`;
  }
  return assignments.map((assignment) => {
    const label = assignment.tier === "required" ? "必看" : "选看";
    return `<span class="day-badge ${assignment.tier}">D${assignment.id} ${label}</span>`;
  }).join("");
}

function renderCatalogRows() {
  const query = document.getElementById("catalogSearch").value.trim().toLowerCase();
  const dayFilter = document.getElementById("catalogDay").value;
  const tierFilter = document.getElementById("catalogTier").value;
  const rows = EPISODE_ROWS.filter((item) => {
    const assignments = assignedDays(item.p);
    const haystack = `${item.p} ${item.title} ${item.cn}`.toLowerCase();
    if (query && !haystack.includes(query)) {
      return false;
    }
    if (dayFilter === "unassigned" && assignments.length !== 0) {
      return false;
    }
    if (dayFilter !== "all" && dayFilter !== "unassigned" && !assignments.some((assignment) => assignment.id === Number(dayFilter))) {
      return false;
    }
    if (tierFilter === "unassigned" && assignments.length !== 0) {
      return false;
    }
    if (tierFilter !== "all" && tierFilter !== "unassigned" && !assignments.some((assignment) => assignment.tier === tierFilter)) {
      return false;
    }
    return true;
  });

  document.getElementById("catalogBody").innerHTML = rows.length
    ? rows.map((item) => {
      const checked = seen.has(`video:${item.p}`) ? " checked" : "";
      return `
        <tr class="${checked ? "done" : ""}">
          <td>
            <label class="checkbox" aria-label="标记 P${item.p} 已看">
              <input type="checkbox" data-progress-key="video:${item.p}"${checked}>
              <span class="checkbox-box"></span>
            </label>
          </td>
          <td class="p-cell">P${item.p}</td>
          <td>
            <div class="table-title">${escapeHtml(item.title)}</div>
            <div class="table-sub">${escapeHtml(item.cn)}</div>
          </td>
          <td>${escapeHtml(item.duration)}</td>
          <td><div class="badge-row">${catalogBadges(item.p)}</div></td>
          <td>
            <a class="video-link" href="${episodeLink(item.p)}" target="_blank" rel="noreferrer">
              <svg class="icon" aria-hidden="true"><use href="#icon-play"/></svg>
              播放
            </a>
          </td>
        </tr>
      `;
    }).join("")
    : `<tr><td colspan="6" class="empty">没有匹配课程</td></tr>`;
}

function renderCatalog() {
  viewEl.innerHTML = `
    <div class="catalog-head">
      <div>
        <h2>课程库</h2>
        <p>共 ${EPISODE_ROWS.length} 节 · 按分 P 编号排列</p>
      </div>
      <div class="catalog-controls">
        <label class="search">
          <svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg>
          <input id="catalogSearch" type="search" placeholder="搜索课程或 P 号">
        </label>
        <select id="catalogDay" aria-label="按日期筛选">
          <option value="all">全部日期</option>
          ${DAYS.map((day) => `<option value="${day.id}">DAY ${day.id} · ${day.label}</option>`).join("")}
          <option value="unassigned">未安排</option>
        </select>
        <select id="catalogTier" aria-label="按类型筛选">
          <option value="all">全部类型</option>
          <option value="required">必看</option>
          <option value="optional">选看</option>
          <option value="unassigned">未安排</option>
        </select>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>状态</th>
            <th>P</th>
            <th>课程</th>
            <th>时长</th>
            <th>安排</th>
            <th>链接</th>
          </tr>
        </thead>
        <tbody id="catalogBody"></tbody>
      </table>
    </div>
  `;
  document.getElementById("catalogSearch").addEventListener("input", renderCatalogRows);
  document.getElementById("catalogDay").addEventListener("change", renderCatalogRows);
  document.getElementById("catalogTier").addEventListener("change", renderCatalogRows);
  renderCatalogRows();
  setActiveTab("catalog");
  updateAllProgress();
}

function renderView(view) {
  currentView = view;
  if (view === "overview") {
    renderOverview();
  } else if (view === "catalog") {
    renderCatalog();
  } else {
    renderDay(view);
  }
}

function syncCheckboxes(key) {
  document.querySelectorAll(`input[data-progress-key="${key}"]`).forEach((input) => {
    input.checked = seen.has(key);
    const row = input.closest("tr");
    if (row) {
      row.classList.toggle("done", input.checked);
    }
    const lesson = input.closest(".lesson");
    if (lesson) {
      lesson.classList.toggle("done", input.checked);
    }
    const exercise = input.closest(".exercise");
    if (exercise) {
      exercise.classList.toggle("done", input.checked);
    }
  });
}

tabsEl.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-view]");
  if (!button) {
    return;
  }
  const view = button.dataset.view;
  renderView(view === "overview" || view === "catalog" ? view : Number(view));
});

viewEl.addEventListener("click", (event) => {
  const button = event.target.closest("[data-open-day]");
  if (button) {
    renderView(Number(button.dataset.openDay));
  }
});

document.addEventListener("click", async (event) => {
  const button = event.target.closest("[data-copy-command]");
  if (!button) {
    return;
  }
  const originalText = button.textContent;
  const copied = await copyText(button.dataset.copyCommand || "");
  button.textContent = copied ? "已复制" : "复制失败";
  window.setTimeout(() => {
    button.textContent = originalText;
  }, 1500);
});

document.addEventListener("change", (event) => {
  const input = event.target.closest("input[data-progress-key]");
  if (!input) {
    return;
  }
  const key = input.dataset.progressKey;
  if (input.checked) {
    seen.add(key);
  } else {
    seen.delete(key);
  }
  writeSeen();
  syncCheckboxes(key);
  updateAllProgress();
});

document.getElementById("resetProgress").addEventListener("click", () => {
  if (!window.confirm("清空本机上的勾选记录？")) {
    return;
  }
  seen = new Set();
  writeSeen();
  renderView(currentView);
});

renderTabs();
updateCountdown();
renderView(getTodayDayId() ?? "overview");
</script>
</body>
</html>
